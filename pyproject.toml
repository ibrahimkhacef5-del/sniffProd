[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sniffer"
version = "1.0.0"
authors = [{ name = "ibrahimkhacef5-del" }]
description = "A tool to scan and download website files with correct extensions"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
sniffer = "sniffer.__main__:main"

[tool.setuptools.packages.find]
include = ["sniffer*"]
